<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MED Lernapp – Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #080b10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #c0d0e0;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      border: 1px solid #1c2430;
      border-radius: 14px;
      background: #0a0d14;
      max-width: 420px;
      width: 90%;
    }
    img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 24px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 12px; color: #d8e8f8; }
    p { font-size: 14px; color: #7090b0; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/med-logo.png" alt="MED Logo" />
    <h1>MED LERNAPP</h1>
    <p>Die App befindet sich aktuell in der Wartung.<br>Sie ist in Kürze wieder verfügbar.</p>
  </div>
</body>
</html>
